<svg viewBox="0 0 1000 700" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      <![CDATA[
      /* Professional Modern Color Palette with CSS Variables */
      :root {
        --bg-panel-fill: #f8fafc;
        --bg-panel-stroke: #cbd5e1;
        --title-fill: #0f172a;
        --box-fill: #ffffff;
        --box-stroke: #cbd5e1;
        --box-shadow: rgba(148, 163, 184, 0.12);
        --box-title-fill: #0f172a;
        --box-text-fill: #334155;
        --line-stroke: #64748b;
        --anim-dot-fill: #3b82f6;
        --anim-dot-shadow: rgba(59, 130, 246, 0.5);
        --label-fill: #2563eb;
        --sub-label-fill: #64748b;
        --target-rect-fill: #f1f5f9;
      }

      /* Dark Mode Overrides */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-panel-fill: #0b0f19;
          --bg-panel-stroke: #1e293b;
          --title-fill: #f8fafc;
          --box-fill: #111827;
          --box-stroke: #374151;
          --box-shadow: rgba(0, 0, 0, 0.4);
          --box-title-fill: #f9fafb;
          --box-text-fill: #d1d5db;
          --line-stroke: #4b5563;
          --anim-dot-fill: #60a5fa;
          --anim-dot-shadow: rgba(96, 165, 250, 0.5);
          --label-fill: #3b82f6;
          --sub-label-fill: #9ca3af;
          --target-rect-fill: #1f2937;
        }
      }

      .bg-panel { fill: var(--bg-panel-fill); stroke: var(--bg-panel-stroke); stroke-width: 2; rx: 12; transition: fill 0.3s, stroke 0.3s; }
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: bold; fill: var(--title-fill); letter-spacing: 0.5px; transition: fill 0.3s; }
      .box { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 2; rx: 8; filter: drop-shadow(0 4px 6px var(--box-shadow)); transition: fill 0.3s, stroke 0.3s; }
      .box-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: var(--box-title-fill); transition: fill 0.3s; }
      .box-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: var(--box-text-fill); transition: fill 0.3s; }
      .line { fill: none; stroke: var(--line-stroke); stroke-width: 2.5; transition: stroke 0.3s; }
      .anim-dot { fill: var(--anim-dot-fill); filter: drop-shadow(0 0 6px var(--anim-dot-shadow)); transition: fill 0.3s; }
      .label { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: var(--label-fill); transition: fill 0.3s; }
      .sub-label { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: var(--sub-label-fill); font-style: italic; transition: fill 0.3s; }
      .arrow-head { fill: var(--line-stroke); transition: fill 0.3s; }
      ]]>
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Planes -->
  <rect x="50" y="50" width="900" height="270" class="bg-panel" />
  <text x="70" y="80" class="title">GCP CENTRAL SAAS CONTROL PLANE</text>

  <rect x="50" y="380" width="900" height="280" class="bg-panel" />
  <text x="70" y="410" class="title">CUSTOMER GCP DATA PLANE (TENANT BOUNDARY)</text>

  <!-- Connecting Lines (Symmetric Flow Paths) -->
  <!-- 1. Ingestion -->
  <path d="M 255 600 L 255 580" class="line" marker-end="url(#arrow)" />
  <path d="M 255 420 L 255 350 L 640 350 L 640 290" class="line" marker-end="url(#arrow)" />
  
  <!-- 2 and 3. Reasoning and HITL -->
  <path d="M 540 160 L 460 160" class="line" marker-end="url(#arrow)" />
  <path d="M 460 200 L 540 200" class="line" marker-end="url(#arrow)" />
  
  <!-- 4. Execution -->
  <path d="M 850 290 L 850 420" class="line" marker-end="url(#arrow)" />
  <path d="M 850 580 L 850 600" class="line" marker-end="url(#arrow)" />

  <!-- Boxes -->
  <!-- UI Dashboard -->
  <rect x="50" y="110" width="410" height="180" class="box" />
  <text x="70" y="140" class="box-title">Multi-Tenant UI Dashboard</text>
  <text x="70" y="165" class="box-text">• Incident Triage View &amp; Live Topology Map</text>
  <text x="70" y="190" class="box-text">• RCA / Proposed Fix Verification Pane</text>
  <text x="70" y="215" class="box-text">• HITL Authorization Gate: Approves Scope &amp; JIT minting</text>

  <!-- ADK Core -->
  <rect x="540" y="110" width="410" height="180" class="box" />
  <text x="560" y="140" class="box-title">ADK Multi-Agent Core (Agent Triad)</text>
  <text x="560" y="165" class="box-text">• Frontline Watcher: Perception &amp; Edge Noise Filtering</text>
  <text x="560" y="190" class="box-text">• Troubleshooting Agent: Gemini Reasoning &amp; RCA</text>
  <text x="560" y="215" class="box-text">• Execution Orchestrator: JIT Minting &amp; Auto-Rollback</text>
  <text x="560" y="240" class="box-text">• Clear bifurcation: Autonomous Platform vs. HITL</text>
  <text x="572" y="258" class="box-text">Assisted Application PRs</text>

  <!-- Telemetry -->
  <rect x="50" y="420" width="410" height="160" class="box" />
  <text x="70" y="450" class="box-title">Telemetry &amp; Observation Layer</text>
  <text x="70" y="475" class="box-text">• Edge Heuristic Pre-Filtering Gateway</text>
  <text x="70" y="500" class="box-text">• OpenTelemetry hybrid collectors</text>
  <text x="70" y="525" class="box-text">• Cloud Monitoring Alert Policies &amp; Metric Streams</text>

  <!-- Remediation Layer -->
  <rect x="540" y="420" width="410" height="160" class="box" />
  <text x="560" y="450" class="box-title">Remediation &amp; Safety Layer</text>
  <text x="560" y="475" class="box-text">• Zero-standing privileges via WIF &amp; JIT Broker (15-min TTL)</text>
  <text x="560" y="500" class="box-text">• Bidirectional GitOps reconciliation, PR dry-runs</text>
  <text x="572" y="518" class="box-text">&amp; remote state locks</text>
  <text x="560" y="543" class="box-text">• BRC-ARE snapshotting, canary rollouts, &amp; Telemetry</text>
  <text x="572" y="561" class="box-text">Watchdog auto-rollback</text>

  <!-- Target Resources -->
  <rect x="50" y="600" width="900" height="36" class="box" fill="var(--target-rect-fill)" stroke="var(--box-stroke)" />
  <text x="500" y="622" class="box-title" text-anchor="middle" fill="var(--box-title-fill)">Customer Workload Resources: GKE Clusters • Compute Engine VMs • Cloud SQL Databases • Cloud Storage Buckets • Cloud Spanner</text>

  <!-- Labels -->
  <text x="255" y="405" class="label" text-anchor="middle">1. INGESTION &amp; DETECTION (Telemetry Streaming)</text>
  
  <text x="500" y="145" class="label" text-anchor="middle">2. REASONING</text>
  <text x="500" y="225" class="label" text-anchor="middle">3. HITL APPROVAL</text>
  <text x="500" y="185" class="sub-label" text-anchor="middle">A2A Protocol</text>

  <!-- Execution Label Box/Pill -->
  <rect x="585" y="328" width="320" height="45" rx="8" class="box" />
  <text x="745" y="346" class="label" text-anchor="middle">4. CONTROLLED EXECUTION</text>
  <text x="745" y="363" class="sub-label" text-anchor="middle">(OIDC via Workload Identity Fed + JIT SA Token) ↓</text>

  <!-- Post-Verification Loop Label -->
  <text x="500" y="592" class="label" text-anchor="middle">5. POST-VERIFICATION WATCHDOG LOOP (Zero-Trust Feedback)</text>

  <!-- Animated Active Pipeline Dots -->
  <circle r="3" class="anim-dot">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 255 600 L 255 580" />
  </circle>
  <circle r="3" class="anim-dot">
    <animateMotion dur="5s" repeatCount="indefinite" path="M 255 420 L 255 350 L 640 350 L 640 290" />
  </circle>
  <circle r="3" class="anim-dot">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 540 160 L 460 160" />
  </circle>
  <circle r="3" class="anim-dot">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 460 200 L 540 200" />
  </circle>
  <circle r="3" class="anim-dot">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 850 290 L 850 420" />
  </circle>
  <circle r="3" class="anim-dot">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 850 580 L 850 600" />
  </circle>
</svg>