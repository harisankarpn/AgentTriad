<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg-panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: bold; fill: #1e293b; letter-spacing: 0.5px; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 8; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); }
      .box-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
      .box-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; }
      .anim-dot { fill: #3b82f6; filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.6)); }
      .label { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2563eb; }
      .sub-label { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #64748b; font-style: italic; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Planes -->
  <rect x="50" y="50" width="900" height="250" class="bg-panel" />
  <text x="70" y="80" class="title">CENTRAL SAAS CONTROL PLANE</text>

  <rect x="50" y="350" width="900" height="260" class="bg-panel" />
  <text x="70" y="380" class="title">CUSTOMER GCP DATA PLANE (TENANT)</text>

  <!-- Connecting Lines (Visible) -->
  <!-- 1. Ingestion -->
  <path d="M 225 570 L 225 530" class="line" marker-end="url(#arrow)" />
  <path d="M 225 410 L 225 330 L 550 330 L 550 260" class="line" marker-end="url(#arrow)" />
  
  <!-- 2 & 3. Reasoning and HITL -->
  <path d="M 450 160 L 350 160" class="line" marker-end="url(#arrow)" />
  <path d="M 350 200 L 450 200" class="line" marker-end="url(#arrow)" />
  
  <!-- 4. Execution -->
  <path d="M 750 260 L 750 410" class="line" marker-end="url(#arrow)" />
  <path d="M 750 530 L 750 570" class="line" marker-end="url(#arrow)" />

  <!-- Hidden path for animation -->
  <path id="motionPath" d="M 225 575 L 225 470 L 225 330 L 550 330 L 550 160 L 225 160 L 225 200 L 750 200 L 750 470 L 750 575 L 225 575" fill="none" stroke="none" />

  <!-- Boxes -->
  <!-- UI Dashboard -->
  <rect x="100" y="110" width="250" height="150" class="box" />
  <text x="120" y="140" class="box-title">Multi-Tenant UI Dashboard</text>
  <text x="120" y="165" class="box-text">• Incident Triage View</text>
  <text x="120" y="185" class="box-text">• RCA / Proposed Fix</text>
  <text x="120" y="205" class="box-text">• HITL Authorization Gate</text>

  <!-- ADK Core -->
  <rect x="450" y="110" width="450" height="150" class="box" />
  <text x="470" y="140" class="box-title">ADK Multi-Agent Core</text>
  <text x="470" y="165" class="box-text">• Frontline Watcher (Perception)</text>
  <text x="470" y="185" class="box-text">• Troubleshooting Agent (Reasoning)</text>
  <text x="470" y="205" class="box-text">• Execution Orchestrator (Token Minting)</text>

  <!-- Telemetry -->
  <rect x="100" y="410" width="250" height="120" class="box" />
  <text x="120" y="440" class="box-title">Telemetry &amp; Observation</text>
  <text x="120" y="465" class="box-text">• Cloud Logging Sinks</text>
  <text x="120" y="485" class="box-text">• Cloud Monitoring Alerting</text>
  <text x="120" y="505" class="box-text">• Read-Only SA</text>

  <!-- Remediation Layer -->
  <rect x="450" y="410" width="450" height="120" class="box" />
  <text x="470" y="440" class="box-title">Remediation Layer</text>
  <text x="470" y="465" class="box-text">• Executioner Webhook (Cloud Run)</text>
  <text x="470" y="485" class="box-text">• Parameter Validator &amp; Sanitizer</text>
  <text x="470" y="505" class="box-text">• Least-Privilege IAM SA</text>

  <!-- Target Resources -->
  <rect x="100" y="570" width="800" height="40" class="box" fill="#e2e8f0" stroke="#cbd5e1" />
  <text x="120" y="595" class="box-title" fill="#1e293b">GCP Resources ( GKE / Compute Engine / Cloud SQL / Cloud Storage Resources )</text>

  <!-- Labels -->
  <!-- Moved ingestion label X and Y to avoid overlap with 'CUSTOMER GCP DATA PLANE (TENANT)' -->
  <text x="240" y="395" class="label">1. INGESTION &amp; DETECTION</text>
  
  <!-- Adjusted Reasoning and HITL labels to align better with the arrows -->
  <text x="360" y="150" class="label">2. REASONING</text>
  <text x="360" y="215" class="label">3. HITL APPROVAL</text>
  <text x="370" y="180" class="sub-label">A2A Protocol</text>

  <text x="760" y="340" class="label">4. CONTROLLED EXECUTION</text>
  <text x="420" y="630" class="label">5. POST-VERIFICATION (Loop)</text>

  <text x="760" y="360" class="sub-label">Workload Identity / OIDC</text>

  <!-- Animated Data Packet -->
  <circle r="8" class="anim-dot">
    <animateMotion dur="12s" repeatCount="indefinite">
      <mpath href="#motionPath" />
    </animateMotion>
  </circle>
</svg>