{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-triad.serviceAccountName" . }}
  labels:
    {{- include "agent-triad.labels" . | nindent 4 }}
  {{- $hasAnnotations := or .Values.serviceAccount.eksRoleArn .Values.serviceAccount.aksClientId .Values.serviceAccount.gkeServiceAccount .Values.serviceAccount.annotations }}
  {{- if $hasAnnotations }}
  annotations:
    {{- if .Values.serviceAccount.eksRoleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.eksRoleArn | quote }}
    {{- end }}
    {{- if .Values.serviceAccount.aksClientId }}
    azure.workload.identity/client-id: {{ .Values.serviceAccount.aksClientId | quote }}
    {{- end }}
    {{- if .Values.serviceAccount.gkeServiceAccount }}
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gkeServiceAccount | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
