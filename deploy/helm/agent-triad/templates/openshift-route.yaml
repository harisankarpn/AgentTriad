{{- if or .Values.openshiftRoute.enabled .Values.openshift.enabled -}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "agent-triad.fullname" . }}-control-plane
  labels:
    {{- include "agent-triad.componentLabels" (dict "root" . "component" "control-plane") | nindent 4 }}
  {{- with .Values.openshiftRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.openshiftRoute.host }}
  host: {{ .Values.openshiftRoute.host }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "agent-triad.fullname" . }}-control-plane
    weight: 100
  port:
    targetPort: http
  {{- if .Values.openshiftRoute.tls }}
  tls:
    termination: {{ .Values.openshiftRoute.tls.termination | default "edge" }}
    insecureEdgeTerminationPolicy: {{ .Values.openshiftRoute.tls.insecureEdgeTerminationPolicy | default "Redirect" }}
  {{- end }}
  wildcardPolicy: None
{{- end }}
