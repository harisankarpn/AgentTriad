apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-triad.fullname" . }}-infra-agent
  labels:
    {{- include "agent-triad.componentLabels" (dict "root" . "component" "infra-agent") | nindent 4 }}
spec:
  replicas: {{ .Values.infraAgent.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-triad.componentSelectorLabels" (dict "root" . "component" "infra-agent") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "agent-triad.podLabels" (dict "root" . "component" "infra-agent") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agent-triad.serviceAccountName" . }}
      securityContext:
        {{- include "agent-triad.podSecurityContext" . | nindent 8 }}
      containers:
        - name: infra-agent
          image: "{{ .Values.infraAgent.image.repository }}:{{ .Values.infraAgent.image.tag }}"
          imagePullPolicy: {{ .Values.infraAgent.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.infraAgent.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.infraAgent.service.targetPort | quote }}
            - name: SERVICE_URL
              value: {{ printf "http://%s-infra-agent:%v" (include "agent-triad.fullname" .) .Values.infraAgent.service.port | quote }}
            {{- with .Values.infraAgent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "agent-triad.fullname" . }}-config
            - secretRef:
                name: {{ include "agent-triad.secretName" . }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.infraAgent.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.infraAgent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.infraAgent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.infraAgent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
