{{- if not .Values.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-triad.secretName" . }}
  labels:
    {{- include "agent-triad.labels" . | nindent 4 }}
type: Opaque
stringData:
  AAAS_POSTGRES_DSN: {{ include "agent-triad.postgresDsn" . | quote }}
  AAAS_REDIS_URL: {{ include "agent-triad.redisUrl" . | quote }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  AAAS_LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
  AZURE_OPENAI_API_KEY: {{ .Values.llm.azureOpenaiApiKey | quote }}
  AAAS_DB_READONLY_DSN: {{ .Values.databaseIntrospection.readonlyDsn | quote }}
  AAAS_OIDC_HS256_SECRET: {{ .Values.auth.oidcHs256Secret | quote }}
{{- end }}
